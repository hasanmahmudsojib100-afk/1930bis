<div id="lg" style="display:none;position:fixed;inset:0;z-index:99;background:#f3f5fb;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border:1px solid #e3e8f4;border-radius:16px;padding:22px;width:100%;max-width:340px;font:15px system-ui,sans-serif"><div style="font-size:20px;font-weight:700;margin-bottom:12px">📒 Account Book</div><input id="lu" placeholder="Username" autocapitalize="none" autocomplete="username" style="width:100%;padding:10px;margin:4px 0;border:1px solid #ccd;border-radius:8px"><input id="lp" type="password" placeholder="Password (6+)" autocomplete="current-password" style="width:100%;padding:10px;margin:4px 0;border:1px solid #ccd;border-radius:8px"><input id="lc" placeholder="Signup code (new account only)" style="width:100%;padding:10px;margin:4px 0;border:1px solid #ccd;border-radius:8px"><div id="le" style="color:#dc2626;min-height:20px;font-size:13px"></div><button class="b" onclick="auth('login')" style="width:100%;padding:10px;margin-top:4px">Login</button><button onclick="auth('register')" style="width:100%;padding:10px;margin-top:8px;border:1px solid #4f46e5;color:#4f46e5;background:#fff;border-radius:8px">Create new account</button></div></div>
<script>
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US'),nf=n=>String(Math.round(n*100)/100);
const LC=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString()},dk=t=>LC(t).slice(0,10),today=()=>dk(new Date());
const dlab=k=>new Date(k+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),tlab=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
const mlab=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
/* Legacy types (b2bin, b2bout, last, comm, cash, paybill) are kept only so old saved data still works */
const TL={in:'In',out:'Out',b2bin:'B2B In',b2bout:'B2B Out',last:'Last Balance',comm:'Commission',cash:'Cash',paybill:'Pay Bill'},POS={out:1,b2bin:1,last:1,comm:1,cash:1};
let D={dokan:[],wp:[],bank:[],names:[],bnames:[],med:[],rec:[],rnames:[],adj:[],acc:{},ts:0};

['dokan','wp','bank','names','bnames','med','rec','rnames','adj'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});if(!D.acc||typeof D.acc!=='object')D.acc={};D.ts=D.ts||0;
let pg='in',ds='cash',day=today(),sd=today(),mon=today().slice(0,7),kind='tx',tbl='dokan',io='',nt='a',eid=null,dl=null,cashOn=false;
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad show':'show';setTimeout(()=>t.className='',2400)}
/* Calculation */
const isAg=e=>!(D.acc[e.name]&&D.acc[e.name].t==='p');
const ac=e=>{if(e.cm===false||!(D.dokan.includes(e)||D.wp.includes(e))||!isAg(e))return 0;return e.type==='in'?e.amt*.00375:e.type==='out'?e.amt*.004:0};
function sm(rows){const s={in:0,out:0,b2bin:0,b2bout:0,last:0,comm:0,paybill:0,cash:0};rows.forEach(e=>{s[e.type]+=e.amt;s.comm+=ac(e)});return s}
/* Account balance: last + out + commission - in */
const bal=(l,s)=>l+s.out+s.b2bin+s.comm-s.in-s.paybill;
const rs=e=>e.sg!=null?e.sg*e.amt:(e.type==='in'?e.amt:0);
/* Shop cash: only entries with the Cash button ON count. In = (+), Out = (−). Old entries (no cs flag) still count as before. */
function cashDay(d){const days={};const add=(k,f,v)=>{(days[k]=days[k]||{cin:0,pb:0,man:0,med:0,rec:0,cout:0})[f]+=v};
 D.dokan.forEach(e=>{const k=dk(e.ts);if(e.type==='cash')add(k,'man',e.amt);else if(e.type==='paybill')add(k,'pb',e.amt);else if(e.cs!==false){if(e.type==='in')add(k,'cin',e.amt);else if(e.type==='out')add(k,'cout',e.amt)}});
 D.adj.forEach(e=>add(dk(e.ts),'man',e.amt));D.med.forEach(e=>add(dk(e.ts),'med',e.k==='buy'?-e.amt:e.amt));D.rec.forEach(e=>add(dk(e.ts),'rec',rs(e)));
 const open=0;
 const x=days[d]||{cin:0,pb:0,man:0,med:0,rec:0,cout:0};return {...x,open,close:open+x.cin+x.pb+x.man+x.med+x.rec-x.cout}}
function wpStart(d,tb){const days={};D[tb].forEach(e=>{const x=days[dk(e.ts)]=days[dk(e.ts)]||{in:0,out:0,last:0,hl:0};if(e.type==='in')x.in+=e.amt;else if(e.type==='out')x.out+=e.amt;else if(e.type==='last'){x.last+=e.amt;x.hl=1}});
 let c=0;for(const k of Object.keys(days).sort()){if(k>=d)break;const x=days[k];c=(x.hl?x.last:c)+x.out-x.in}const m=days[d];return m&&m.hl?m.last:c}
function acct(n,tbs,d){const rows=[];tbs.forEach(k=>D[k].forEach(e=>{if(e.name===n&&e.type!=='cash')rows.push(e)}));
 const o=(D.acc[n]||{}).o||0,days={};rows.forEach(e=>(days[dk(e.ts)]=days[dk(e.ts)]||[]).push(e));let last,s;
 if(!d){s=sm(rows);last=o+s.last}else{let c=o;for(const k of Object.keys(days).sort()){if(k>=d)break;const r=days[k],x=sm(r);c=bal(r.some(e=>e.type==='last')?x.last:c,x)}const r=days[d]||[];s=sm(r);last=r.some(e=>e.type==='last')?s.last:c}
 return {...s,last,act:(days[d]||[]).length,tot:bal(last,s)}}
const accNames=tbs=>{const s=new Set(tbs[0]==='bank'?D.bnames:D.names);tbs.forEach(k=>D[k].forEach(e=>{if(e.type!=='cash')s.add(e.name)}));return[...s]};
const GR=[['Shop + WP',['dokan','wp']],['Bank',['bank']]];
function sumData(){return GR.map(g=>[g[0],accNames(g[1]).map(n=>[n,acct(n,g[1],sd)]).filter(x=>!sd||x[1].act>0||x[1].last!==0)]).filter(g=>g[1].length)}
/* Save & cloud: every entry is its own tiny record, so saving never rewrites all data */
let DB=null,UID=null,BUSY=false,CT=null;const syn=t=>$('syn').textContent=t,ref=k=>DB.collection('data/users/'+UID).doc(k);
const TBS=['dokan','wp','bank','med','rec','adj'],T=[],M={sy:0,u:0},lk=(t,id)=>'h:'+t+':'+id,nap=()=>new Promise(r=>setTimeout(r,0));
function wr(k,o){try{localStorage.setItem(k,JSON.stringify(o))}catch(e){toast('Phone storage full',1)}}
function mwr(){wr('h:meta',{names:D.names,bnames:D.bnames,rnames:D.rnames,acc:D.acc,u:M.u,sy:M.sy})}
function after(){syn('Saved on phone \u00b7 uploading soon');clearTimeout(CT);CT=setTimeout(doSync,6000)}
function put(t,e){e.u=Date.now();wr(lk(t,e.id),e);after()}
function rm(t,id){D[t]=D[t].filter(e=>e.id!==id);const z={id,del:1,u:Date.now()};T.push({t,z});wr(lk(t,id),z);after()}
function mput(){M.u=Date.now();mwr();after()}
function save(){}
(function(){try{const old=localStorage.getItem('hisab1');
 if(old&&!localStorage.getItem('h:v')){const s=JSON.parse(old);['names','bnames','rnames'].forEach(k=>D[k]=s[k]||[]);D.acc=s.acc||{};M.u=s.ts||1;TBS.forEach(t=>(s[t]||[]).forEach(e=>{e.u=s.ts||1;wr(lk(t,e.id),e);D[t].push(e)}));mwr();localStorage.setItem('h:v','2')}
 else for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.slice(0,2)!=='h:'||k==='h:v')continue;const o=JSON.parse(localStorage.getItem(k));
  if(k==='h:meta'){['names','bnames','rnames'].forEach(x=>D[x]=o[x]||[]);D.acc=o.acc||{};M.u=o.u||0;M.sy=o.sy||0}else{const t=k.split(':')[1];if(!D[t])continue;o.del?T.push({t,z:o}):D[t].push(o)}}
 }catch(e){}TBS.forEach(t=>D[t].sort((a,b)=>b.id-a.id))})();
let HTTP=false;const API='api.php';
const TK='h:tok',hu=()=>API+'?t='+encodeURIComponent(localStorage.getItem(TK)||''),showLogin=()=>{$('lg').style.display='flex'};
function wipe(){Object.keys(localStorage).filter(k=>k.slice(0,2)==='h:'&&k!==TK&&k!=='h:owner').forEach(k=>localStorage.removeItem(k));localStorage.removeItem('hisab1')}
const dirty=()=>TBS.some(t=>D[t].some(e=>(e.sy||0)<e.u))||T.some(x=>(x.z.sy||0)<x.z.u)||M.sy<M.u;
async function auth(a){$('le').textContent='';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,u:$('lu').value.trim(),p:$('lp').value,c:$('lc').value.trim()})}),j=await r.json();if(!j.token){$('le').textContent=j.error||'Error';return}
 const un=$('lu').value.trim().toLowerCase(),ow=localStorage.getItem('h:owner');if(ow&&ow!==un)wipe();localStorage.setItem('h:owner',un);localStorage.setItem(TK,j.token);location.reload()}catch(e){$('le').textContent='Cannot reach server'}}
async function logout(){if(!confirm('Logout from this phone?'))return;try{await doSync()}catch(e){}if(dirty()&&!confirm('Some data is NOT uploaded yet and will be lost. Logout anyway?'))return;localStorage.removeItem(TK);localStorage.removeItem('h:owner');wipe();location.reload()}

async function hget(){const r=await fetch(hu(),{cache:'no-store'});if(r.status===401){localStorage.removeItem(TK);showLogin();throw new Error('auth')}const j=await r.json();return Object.entries(j.docs||{}).map(([id,v])=>({id,data:()=>v}))}
async function hput(l){const r=await fetch(hu(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({docs:Object.fromEntries(l)})});if(r.status===401){localStorage.removeItem(TK);showLogin();throw new Error('auth')}if(!r.ok)throw new Error('put')}
const cget=async()=>HTTP?hget():(await DB.collection('data/users/'+UID).get()).docs,cput=async l=>{if(HTTP)return hput(l);for(const[k,o]of l)await ref(k).set(o)};
async function doSync(){clearTimeout(CT);if(!(DB&&UID||HTTP)||BUSY)return;BUSY=true;
 try{const q=[];TBS.forEach(t=>D[t].forEach(e=>{if((e.sy||0)<e.u)q.push([t,e])}));T.forEach(x=>{if((x.z.sy||0)<x.z.u)q.push([x.t,x.z])});
  const W=HTTP?100:10;for(let i=0;i<q.length;i+=W){const ch=q.slice(i,i+W),us=ch.map(x=>x[1].u);syn('Uploading '+Math.min(i+W,q.length)+'/'+q.length+'\u2026');await cput(ch.map(([t,e])=>{const o=Object.assign({},e);delete o.sy;return[t+'_'+e.id,o]}));ch.forEach(([t,e],j)=>{e.sy=us[j];wr(lk(t,e.id),e)});await nap()}
  if(M.sy<M.u){const u0=M.u;await cput([['meta',{names:D.names,bnames:D.bnames,rnames:D.rnames,acc:Object.entries(D.acc).map(([n,a])=>({n,t:a.t,o:a.o})),u:u0}]]);M.sy=u0;mwr()}
  syn('\u2713 Data saved to cloud')}catch(e){syn('Upload paused \u00b7 tap \u2601 Sync to retry')}BUSY=false}
async function pull(){const s={docs:await cget()},mp={},tm=new Map();TBS.forEach(t=>mp[t]=new Map(D[t].map(e=>[e.id,e])));T.forEach(x=>tm.set(x.t+x.z.id,x.z));let ch=0;
 for(const d of s.docs){const o=d.data(),id=d.id;if(!o)continue;
  if(id==='meta'){if(o.u){if(o.u>M.u){D.names=o.names||[];D.bnames=o.bnames||[];D.rnames=o.rnames||[];D.acc={};(o.acc||[]).forEach(a=>D.acc[a.n]={t:a.t,o:a.o});M.u=M.sy=o.u;mwr();ch++}}else if(!D.names.length){D.names=o.names||[];D.bnames=o.bnames||[];D.acc={};(o.acc||[]).forEach(a=>D.acc[a.n]={t:a.t,o:a.o});mput()}
   if(!o.u&&Array.isArray(o.adj))o.adj.forEach(e=>{if(!mp.adj.has(e.id)){e.u=1;D.adj.push(e);mp.adj.set(e.id,e);wr(lk('adj',e.id),e);ch++}});continue}
  if(TBS.includes(id)&&Array.isArray(o.items)){o.items.forEach(e=>{if(!mp[id].has(e.id)&&!tm.has(id+e.id)){e.u=1;D[id].push(e);mp[id].set(e.id,e);wr(lk(id,e.id),e);ch++}});continue}
  const i=id.indexOf('_'),t=id.slice(0,i),rid=+id.slice(i+1);if(!mp[t])continue;const cur=mp[t].get(rid),tb=tm.get(t+rid);
  if(o.del){if(cur&&(cur.u||0)<=o.u){mp[t].delete(rid);D[t]=D[t].filter(e=>e.id!==rid);wr(lk(t,rid),Object.assign({},o,{sy:o.u}));ch++}}
  else if(!(tb&&tb.u>=o.u)&&(!cur||(cur.u||0)<o.u)){const e=Object.assign({},o,{sy:o.u});if(cur)D[t]=D[t].filter(x=>x.id!==rid);D[t].push(e);mp[t].set(rid,e);wr(lk(t,rid),e);ch++}}
 if(ch){TBS.forEach(t=>D[t].sort((a,b)=>b.id-a.id));render()}}
async function fullSync(){if(HTTP&&!localStorage.getItem(TK)){showLogin();return}if(!(DB&&UID||HTTP))return toast('Cloud not connected',1);if(BUSY)return;try{syn('Downloading\u2026');await pull()}catch(e){syn(HTTP?'Server error or login expired \u00b7 tap \u2601 Sync':'Download failed');return}await doSync()}
(async()=>{try{if(!window.claude||!claude.use){HTTP=true;$('lob').style.display='';if(!localStorage.getItem(TK)){showLogin();return}await fullSync();return}
 try{const pm=await claude.use('permissions');if(pm)await pm.request(['db','user'])}catch(e){}
 const[db,us]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!us){syn('Saved on this phone only');return}
 const id=await us.id();if(!id){syn('Saved on this phone only');return}DB=db;UID=id;await fullSync()}catch(e){syn('Saved on this phone only')}})();
/* Navigation */
function go(p){pg=p;eid=null;$('svtx').textContent='Save';render();scrollTo(0,0)}
function render(){document.querySelectorAll('.pgx').forEach(e=>e.style.display='none');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===pg));
 if(pg==='in'){$('pg-in').style.display='block';setK(kind);setT(tbl);return}
 const m=$('main');m.style.display='block';m.innerHTML={dokan:rDokan,wp:()=>rTb('wp'),bank:()=>rTb('bank'),sum:rSum}[pg]()}
const sday=v=>{day=v||today();render()},ssd=v=>{sd=v;render()};
const dbar=(v,f,all)=>`<div class="row2" style="margin:0 0 12px"><input type="date" value="${v}" onchange="${f}(this.value)" style="margin:0"><button class="b" onclick="${f}('${all?'':today()}')">${all?'All dates':'Today'}</button></div>`;
function dd(k,fn){if(dl!==k){dl=k;render();return}dl=null;fn();save();render()}
const dbtn=k=>`<button class="lk" onclick="dd('${k}',()=>del('${k}'))">${dl===k?'<b style="color:var(--r)">Press again</b>':'Delete'}</button>`;
function del(k){const t=k[0],id=+k.slice(1);if(t==='t')['dokan','wp','bank'].forEach(x=>{if(D[x].some(e=>e.id===id))rm(x,id)});else rm(t==='m'?'med':t==='r'?'rec':'adj',id)}
/* Shop */
function rDokan(){const c=cashDay(day);return dbar(day,'sday')+`<div class="big"><small>Shop cash — ${dlab(day)}</small><b>${fmt(c.close)}</b></div><div class="seg">${[['cash','Cash'],['med','Medicine'],['tx','Transactions']].map(x=>`<button class="${ds===x[0]?'on':''}" onclick="ds='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div style="height:12px"></div>`+{cash:()=>vCash(c),med:vMed,tx:()=>vTx('dokan')}[ds]()}
const sr=(l,v,c='')=>`<div class="sr ${c}"><span>${l}</span><b>${v}</b></div>`;
function vCash(c){const ad=D.adj.filter(e=>dk(e.ts)===day);return `<div class="card"><div class="hd">Cash Summary</div>${sr('Cash In (+)',fmt(c.cin))}${sr('Cash Out (−)',fmt(-c.cout))}${c.pb?sr('Pay Bill (old)',fmt(c.pb)):''}${sr('Manual Cash (+/−)',fmt(c.man))}${sr('Medicine (+/−)',fmt(c.med))}${c.rec?sr('Recharge (old, +/−)',fmt(c.rec)):''}${sr('Cash',fmt(c.close),'t')}</div><div class="card"><div class="hd">Manual Cash Entries</div>${ad.length?ad.map(e=>`<div class="ln"><div><small>${E(e.note||'—')} · ${tlab(e.ts)}</small>${dbtn('a'+e.id)}</div><div class="am ${e.amt>0?'p':'m'}">${e.amt>0?'+':'−'}${fmt(Math.abs(e.amt))}</div></div>`).join(''):'<small style="color:var(--m)">No entries on this day</small>'}</div>`}
function vMed(){const ents=D.med.filter(e=>dk(e.ts).slice(0,7)===mon).sort((a,b)=>new Date(b.ts)-new Date(a.ts));let se=0,bu=0,ds1=0,db=0;ents.forEach(e=>e.k==='buy'?bu+=e.amt:se+=e.amt);D.med.forEach(e=>{if(dk(e.ts)===day)e.k==='buy'?db+=e.amt:ds1+=e.amt});
 const days={};ents.forEach(e=>(days[dk(e.ts)]=days[dk(e.ts)]||[]).push(e));
 return `<input type="month" value="${mon}" onchange="mon=this.value||mon;render()" style="margin:0 0 12px"><div class="big"><small>Medicine — ${mlab(mon)} (Sell − Buy)</small><b>${fmt(se-bu)}</b><div class="ts"><div><span>Sold this month</span><b>${fmt(se)}</b></div><div><span>Bought this month</span><b>${fmt(bu)}</b></div></div><div class="ts"><div><span>${dlab(day)} sold</span><b>${fmt(ds1)}</b></div><div><span>${dlab(day)} bought</span><b>${fmt(db)}</b></div></div></div><div class="card">${Object.keys(days).length?Object.keys(days).sort().reverse().map(k=>{let n=0;days[k].forEach(e=>n+=e.k==='buy'?-e.amt:e.amt);return `<div class="sr t"><span>${dlab(k)}</span><b>${fmt(n)}</b></div>`+days[k].map(e=>`<div class="ln"><div><small>${e.k==='buy'?'Buy':'Sell'} · ${E(e.note||'—')} · ${tlab(e.ts)}</small>${dbtn('m'+e.id)}</div><div class="am ${e.k==='buy'?'m':'p'}">${e.k==='buy'?'−':'+'}${fmt(e.amt)}</div></div>`).join('')}).join(''):'<small style="color:var(--m)">No entries this month</small>'}</div>`}
function trow(tb,e){const a=ac(e),p=POS[e.type],ct=tb==='dokan'&&(e.type==='in'||e.type==='out')&&e.cs!==false?` · Cash ${e.type==='in'?'+':'−'}`:'';return `<div class="ln"><div><b>${E(e.name)}</b><small>${E(e.num||'-')} · ${TL[e.type]}${e.pp?' · '+E(e.pp):''}${ct}${a?` · Commission +${fmt(a)}`:''}</small><button class="lk" onclick="ed('${tb}',${e.id})">Edit</button>${dbtn('t'+e.id)}</div><div class="am ${p?'p':'m'}">${p?'+':'−'}${fmt(e.amt)}<small>${tlab(e.ts)}</small></div></div>`}
function vTx(tb){const rows=D[tb].filter(e=>dk(e.ts)===day).sort((a,b)=>new Date(b.ts)-new Date(a.ts)),s=sm(rows);
 return `<div class="card"><div class="ts" style="margin:0">${[['In',s.in],['Out',s.out],['Commission',s.comm]].map(x=>`<div style="background:#f3f5fb"><span style="color:var(--m)">${x[0]}</span><b>${fmt(x[1])}</b></div>`).join('')}</div></div><div class="card">${rows.length?rows.map(e=>trow(tb,e)).join(''):'<small style="color:var(--m)">No transactions on this day</small>'}</div>`}
function rTb(tb){const ls=wpStart(day,tb),s=sm(D[tb].filter(e=>dk(e.ts)===day));
 return dbar(day,'sday')+`<div class="big"><small>${tb==='wp'?'WP':'Bank'} — balance on ${dlab(day)}</small><b>${fmt(ls+s.out-s.in)}</b><div class="ts"><div><span>Previous balance</span><b>${fmt(ls)}</b></div></div></div>`+(tb==='wp'?'<button class="b w" onclick="shareWP()">Send WP text</button>':'')+vTx(tb)}
function shareWP(){const rows=D.wp.filter(e=>dk(e.ts)===day),s=sm(rows),l=rows.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0],dg=(l?String(l.num||'').replace(/\D/g,'').slice(-4):'')||'----',lb=wpStart(day,'wp'),m=lb+s.out;
 wa(new Date(day+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'\n'+dg+'-'+nf(s.in)+'\njoma-'+nf(s.out)+'\nBalance - '+nf(lb)+'+'+nf(s.out)+'='+nf(m)+'-'+nf(s.in)+'='+nf(m-s.in))}
function wa(t){const a=document.createElement('a');a.href='https://wa.me/8801866212500?text='+encodeURIComponent(t);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
/* Summary */
const aLines=a=>[['Last balance',a.last],['In',a.in],['Out',a.out],['Commission',a.comm],['B2B In (old)',a.b2bin],['B2B Out (old)',a.b2bout],['Pay Bill (old)',a.paybill],['Balance',a.tot,1]].filter(l=>l[2]||['Last balance','In','Out','Commission'].includes(l[0])||l[1]!==0);
function rSum(){const G=sumData();let h=dbar(sd,'ssd',1)+`<div class="mut" style="margin:0 2px 8px;color:var(--m)">${sd?dlab(sd):'All dates'}</div>`;
 G.forEach(g=>{h+=`<div class="hd" style="margin:14px 2px 8px">${g[0]}</div>`;g[1].forEach(x=>{h+=`<div class="card"><div class="hd">${E(x[0])} <small style="color:var(--m);font-weight:400">· ${(D.acc[x[0]]||{}).t==='p'?'Personal':'Agent'}</small></div>${aLines(x[1]).map(l=>sr(l[0],fmt(l[1]),l[2]?'t':'')).join('')}</div>`})});
 if(!G.length)h+='<div class="card"><small style="color:var(--m)">No entries</small></div>';
 if(sd){const c=cashDay(sd);h+=`<div class="hd" style="margin:14px 2px 8px">Shop Cash</div><div class="card">${sr('Cash',fmt(c.close),'t')}</div>`}
 let ms=0,mb=0;D.med.forEach(e=>{if(!sd||dk(e.ts)===sd)e.k==='buy'?mb+=e.amt:ms+=e.amt});let rb=0;D.rec.forEach(e=>{if(!sd||dk(e.ts)===sd)rb+=rs(e)});
 h+=`<div class="hd" style="margin:14px 2px 8px">Medicine</div><div class="card">${sr('Medicine sold',fmt(ms))}${sr('Medicine bought',fmt(mb))}${rb?sr('Recharge (old, +/−)',fmt(rb)):''}</div><button class="b w" onclick="shareSum()">Send on WhatsApp</button>`;return h}
function shareSum(){let t='*Summary — '+(sd?dlab(sd):'All dates')+'*';sumData().forEach(g=>{t+='\n\n*'+g[0]+'*';g[1].forEach(x=>{t+='\n\n_'+x[0]+'_'+aLines(x[1]).filter(l=>l[2]||l[1]!==0).map(l=>'\n'+l[0]+': '+nf(l[1])).join('')})});wa(t)}
/* Input */
function tg(i){const e=$(i);e.style.display=e.style.display==='block'?'none':'block'}
function setK(k){kind=k;document.querySelectorAll('.fx').forEach(e=>e.style.display=e.id==='f-'+k?'block':'none');document.querySelectorAll('#kseg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(!$('edate').value)$('edate').value=today()}
function updCash(){const b=$('cbtn');b.style.display=tbl==='dokan'?'':'none';b.classList.toggle('on',cashOn);b.textContent=cashOn?'Cash ✓':'Cash'}
function togCash(){cashOn=!cashOn;updCash()}
function setT(t){tbl=t;if(t!=='dokan')cashOn=false;document.querySelectorAll('#tseg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));updCash();fillAcc()}
function fillAcc(){const v=$('acc').value,n=accNames(tbl==='bank'?['bank']:['dokan','wp']);$('acc').innerHTML='<option value="">Select account</option>'+n.map(x=>`<option${x===v?' selected':''}>${E(x)}</option>`).join('')}
function setIO(v){io=v;document.querySelectorAll('#ioseg button').forEach(b=>b.classList.toggle('on',b.dataset.i===v))}
function setNT(t){nt=t;$('nt-a').classList.toggle('on',t==='a');$('nt-p').classList.toggle('on',t==='p')}
function addAcc(){const n=$('nn').value.trim();if(!n)return toast('Enter a name',1);const l=parseFloat($('nl').value)||0,L=tbl==='bank'?D.bnames:D.names;if(!L.includes(n))L.push(n);D.acc[n]={t:nt,o:l};mput();$('nn').value='';$('nl').value='';$('na').style.display='none';fillAcc();$('acc').value=n;toast('✓ Account added')}
function delAcc(){const n=$('acc').value;if(!n)return toast('Select an account first',1);if(dl!=='x'+n){dl='x'+n;return toast('Press again to delete "'+n+'" — all its entries will be deleted',1)}dl=null;const g=tbl==='bank'?['bank']:['dokan','wp'];g.forEach(k=>D[k].filter(e=>e.name===n).forEach(e=>rm(k,e.id)));D.names=D.names.filter(x=>x!==n);D.bnames=D.bnames.filter(x=>x!==n);delete D.acc[n];mput();fillAcc();toast('✓ Deleted')}
function tsOf(){const d=$('edate').value||today();return d===today()?new Date().toISOString():new Date(d+'T'+new Date().toTimeString().slice(0,8)).toISOString()}
function saveTx(){const n=$('acc').value,a=parseFloat($('amt').value);if(!n)return toast('Select an account',1);if(isNaN(a))return toast('Enter an amount',1);if(!io)return toast('Select In or Out',1);
 const cs=tbl==='dokan'&&cashOn,e={id:Date.now(),name:n,num:$('num').value.trim(),amt:a,type:io,pp:$('oth').value,cs,ts:tsOf()};if(eid){D[eid.tb]=D[eid.tb].filter(x=>x.id!==eid.id);e.id=eid.id;eid=null;$('svtx').textContent='Save'}
 D[tbl].unshift(e);put(tbl,e);$('amt').value='';$('num').value='';$('oth').value='';setIO('');cashOn=false;updCash();toast(cs?'✓ Saved (Cash '+(e.type==='in'?'+':'−')+')':'✓ Saved')}
function ed(tb,id){const e=D[tb].find(x=>x.id===id);if(!e)return;if(e.type!=='in'&&e.type!=='out')return toast('Old entry type — delete it and add again with In/Out',1);pg='in';kind='tx';tbl=tb;render();fillAcc();$('acc').value=e.name;$('num').value=e.num||'';$('amt').value=e.amt;$('edate').value=dk(e.ts);$('oth').value=e.pp||'';setIO(e.type);cashOn=tb==='dokan'&&e.cs!==false;updCash();eid={tb,id};$('svtx').textContent='Update';scrollTo(0,0)}
function saveAdj(sg){const a=parseFloat($('ca').value);if(isNaN(a)||a<=0)return toast('Enter an amount',1);{const x={id:Date.now(),amt:sg*a,note:$('cn').value.trim(),ts:tsOf()};D.adj.unshift(x);put('adj',x)}$('ca').value='';$('cn').value='';toast('✓ Cash '+(sg>0?'added':'subtracted'))}
function saveMed(k){const a=parseFloat($('ma').value);if(isNaN(a)||a<=0)return toast('Enter an amount',1);{const x={id:Date.now(),amt:a,k,note:$('mn').value.trim(),ts:tsOf()};D.med.unshift(x);put('med',x)}$('ma').value='';$('mn').value='';toast('✓ Medicine '+(k==='buy'?'buy':'sell')+' saved')}
$('edate').value=today();render();
setInterval(()=>{if(today()!==go.ld){const o=go.ld;go.ld=today();if(o&&day===o)day=go.ld;if(o&&sd===o)sd=go.ld;if(pg!=='in')render()}},30000);go.ld=today();
</script></body></html>
